name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - name: Export local Supabase keys
        run: |
          # `supabase status -o env` (latest CLI) quotes values, e.g. API_URL="http://..." —
          # eval to let the shell unquote them, then re-export under the names the tests read.
          eval "$(supabase status -o env)"
          echo "SUPABASE_URL=${API_URL}" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=${ANON_KEY}" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_KEY=${SERVICE_ROLE_KEY}" >> $GITHUB_ENV
      - run: npm run test:integration
