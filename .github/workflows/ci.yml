name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: npm run release:check
      - run: npm run check:esm
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
  integration:
    # PR #68 is applications-only; current-source C2 runtime approval is separate.
    # This broad live runner has no approved target/fixture setup for that scope.
    # Skip before Supabase setup; retain identity guards and other PR/main coverage.
    # See docs/verification/2026-10-28-pr-68-ci.md for the blocker and re-enable criteria.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.number != 68 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: "2.110.0" }
      # Placeholder Twilio token: enables phone auth so the phone-primary bootstrap test
      # can sign in via [auth.sms.test_otp]. No real SMS is ever sent (test number only).
      - run: supabase start
        env:
          SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: test-token-ci
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - name: Export local Supabase keys
        run: |
          # `supabase status -o env` (latest CLI) quotes values, e.g. API_URL="http://..." —
          # eval to let the shell unquote them, then re-export under the names the tests read.
          eval "$(supabase status -o env)"
          echo "SUPABASE_URL=${API_URL}" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=${ANON_KEY}" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_KEY=${SERVICE_ROLE_KEY}" >> $GITHUB_ENV
      - run: npm run test:integration
        env:
          ADMIN_SECRET: test-admin-secret
