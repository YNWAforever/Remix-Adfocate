name: Supabase Production Release
on:
  workflow_dispatch:
    inputs:
      bundle_path:
        description: Committed sanitized evidence bundle path
        required: true
        type: string
      bundle_digest:
        description: Approved SHA-256 bundle digest
        required: true
        type: string
      project_ref:
        description: Exact approved Supabase project reference
        required: true
        type: string
      approval:
        description: Exact APPROVE phrase from the runbook
        required: true
        type: string

jobs:
  migrate:
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify evidence and execute approved migration range
        run: >-
          npm run release:execute --
          --bundle "$BUNDLE_PATH"
          --bundle-digest "$BUNDLE_DIGEST"
          --project-ref "$PROJECT_REF"
          --approval "$APPROVAL"
          --apply
        env:
          BUNDLE_PATH: "${{ inputs.bundle_path }}"
          BUNDLE_DIGEST: "${{ inputs.bundle_digest }}"
          PROJECT_REF: "${{ inputs.project_ref }}"
          APPROVAL: "${{ inputs.approval }}"
          RELEASE_DATABASE_URL: "${{ secrets.SUPABASE_DB_URL }}"
          RELEASE_PROJECT_REF: "${{ vars.SUPABASE_PROJECT_REF }}"
          RELEASE_APPLICATION_COMMIT: "${{ github.sha }}"
